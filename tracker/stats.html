<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Riftbound – Card stats</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 1rem; background: #1a1a1e; color: #e4e4e7; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .overview { display: flex; gap: 1.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat-box { background: #25252a; padding: 0.75rem 1rem; border-radius: 8px; }
    .stat-box .value { font-size: 1.25rem; font-weight: 600; }
    .stat-box .label { font-size: 0.85rem; color: #a1a1aa; }
    .import-area { margin-bottom: 1.5rem; }
    .import-area label { display: block; margin-bottom: 0.5rem; color: #a1a1aa; }
    .import-area textarea { width: 100%; min-height: 100px; padding: 0.5rem; background: #25252a; border: 1px solid #3f3f46; border-radius: 6px; color: #e4e4e7; font-family: monospace; font-size: 0.85rem; }
    .import-area input[type="file"] { margin-top: 0.5rem; }
    .btn { background: #3b82f6; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
    .btn:hover { background: #2563eb; }
    .btn.secondary { background: #3f3f46; }
    .btn.secondary:hover { background: #52525b; }
    table { width: 100%; border-collapse: collapse; background: #25252a; border-radius: 8px; overflow: hidden; }
    th, td { padding: 0.5rem 0.75rem; text-align: left; }
    th { background: #2d2d33; font-weight: 600; font-size: 0.85rem; color: #a1a1aa; }
    tr:nth-child(even) { background: #1f1f23; }
    .num { text-align: right; }
    .pct-good { color: #4ade80; }
    .pct-bad { color: #f87171; }
    .pct-mid { color: #fbbf24; }
    .error { color: #f87171; margin-top: 0.5rem; }
    .hint { color: #71717a; font-size: 0.85rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Riftbound card stats</h1>
    <p class="hint">Import JSON exported from the Riftbound Tracker extension to see winrate when each card is played.</p>

    <div class="import-area">
      <label>Paste exported JSON or choose file</label>
      <textarea id="json-input" placeholder='Paste content of riftbound-stats-*.json here'></textarea>
      <input type="file" id="file-input" accept=".json,application/json" />
      <div class="error" id="error"></div>
    </div>

    <div class="overview" id="overview" style="display: none;">
      <div class="stat-box">
        <div class="value" id="total-games">0</div>
        <div class="label">Total games</div>
      </div>
      <div class="stat-box">
        <div class="value" id="total-wins">0</div>
        <div class="label">Wins</div>
      </div>
      <div class="stat-box">
        <div class="value" id="overall-wr">0%</div>
        <div class="label">Overall winrate</div>
      </div>
    </div>

    <table id="card-table" style="display: none;">
      <thead>
        <tr>
          <th>Card</th>
          <th class="num">Games played</th>
          <th class="num">Wins when played</th>
          <th class="num">Winrate when played</th>
        </tr>
      </thead>
      <tbody id="card-body"></tbody>
    </table>
  </div>
  <script src="stats.js"></script>
</body>
</html>
